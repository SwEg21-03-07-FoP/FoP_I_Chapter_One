<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Chapter 1 Multiple-Choice Questions</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>
:root{--bg:#fafaf7;--fg:#1d2433;--mu:#5b6475;--ac:#1f5f8b;--card:#fff;--bd:#dfe3ea;--code:#eef2f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13171f;--fg:#e8ebf1;--mu:#98a2b3;--ac:#6cb4e4;--card:#1b212c;--bd:#2c3442;--code:#232b38;color-scheme:dark}}
:root[data-theme=dark]{--bg:#13171f;--fg:#e8ebf1;--mu:#98a2b3;--ac:#6cb4e4;--card:#1b212c;--bd:#2c3442;--code:#232b38;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 Georgia,'Times New Roman',serif}
main{max-width:820px;margin:0 auto;padding:36px 20px 60px}h1{font-size:clamp(26px,5vw,38px);line-height:1.2;text-align:center;margin:.2em 0}
.sub{text-align:center;color:var(--mu);margin-bottom:28px}
h2{margin-top:1.8em;padding-top:.4em;border-top:2px solid var(--ac);font-size:22px}
.card,.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 18px;margin:12px 0}
.tag{font:600 12px system-ui;background:var(--code);color:var(--ac);border-radius:10px;padding:2px 10px;margin-left:8px;vertical-align:middle}
pre{background:var(--code);padding:12px 16px;border-radius:8px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,monospace}
pre.mermaid{background:transparent;text-align:center}
.mu{color:var(--mu);font-size:15px}
button{font:14px system-ui;background:var(--ac);color:var(--bg);border:0;border-radius:16px;padding:6px 16px;cursor:pointer;margin:4px 6px 4px 0}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border-radius:8px;font:15px system-ui;background:var(--code);color:var(--fg);border:1px solid var(--bd)}
.ok{border-color:#2e9b57!important;background:rgba(46,155,87,.2)!important}.no{border-color:#c0392b!important;background:rgba(192,57,43,.2)!important}
.why{font:14px system-ui;color:var(--mu);margin-top:6px}
</style></head><body><main><h1>Chapter 1 Multiple-Choice Questions</h1><p class="sub">Basic Concepts of Programming · 30 questions</p><p id="score" class="mu" style="text-align:center"></p><div id="quiz"></div><p style="text-align:center"><button id="rst">Start again</button><button id="keyb">Show answer key</button></p><div id="key" class="card" hidden></div></main><script>
(function(){var Q=[["Which statement best describes a computer program?", "A set of explicit, unambiguous instructions that tells the computer what to do", "A physical part of the computer", "A list of computer users", "A guess the computer makes"], ["Writing, testing, debugging and maintaining source code is called…", "Programming", "Networking", "Hardware design", "Typing"], ["Which is NOT a reason to study programming?", "It removes the need to test your work", "It develops logical thinking", "It can automate repetitive tasks", "It opens career opportunities"], ["Which life cycle stage comes first?", "Planning", "Testing", "Maintenance", "Coding"], ["A feasibility study checks whether…", "a project is worth doing", "a program has bugs", "a flowchart is correct", "a language is high-level"], ["Which feasibility check asks whether users and management will accept the system?", "Operational", "Technical", "Economic", "Organizational"], ["Requirements analysis focuses on…", "what must be done, not how", "writing the code", "fixing bugs", "installing hardware"], ["Locating and fixing errors in a program is called…", "Debugging", "Documenting", "Planning", "Deploying"], ["Testing the whole system on its real platform is…", "System testing", "Unit testing", "Integration testing", "Maintenance"], ["Updating a program after the grading rules change belongs to…", "Maintenance", "Design", "Planning", "Requirements analysis"], ["The three questions of problem analysis are about…", "input, process and output", "cost, time and size", "author, date and title", "hardware, software and network"], ["A problem is best described as…", "the gap between the existing and the desired situation", "an error message", "a programming language", "a type of flowchart"], ["Splitting a large problem into smaller parts is…", "top-down design", "bottom-up design", "debugging", "integration testing"], ["Which is a characteristic of an algorithm?", "Finiteness", "Ambiguity", "Randomness", "Endlessness"], ["An algorithm is independent of…", "any programming language", "its input", "its output", "its steps"], ["A computer needs detailed step-by-step instructions because it is…", "an algorithm-responding machine", "able to guess what we mean", "able to learn by itself", "a heuristic-responding machine"], ["Pseudocode is…", "an informal, language-independent description of an algorithm", "machine code", "a compiled program", "a type of memory"], ["Which flowchart symbol marks Start and Stop?", "Oval (terminal)", "Diamond", "Parallelogram", "Rectangle"], ["A parallelogram in a flowchart represents…", "input or output", "a decision", "a calculation", "a connector"], ["A diamond in a flowchart represents…", "a decision with two exits", "input or output", "the end of the program", "a calculation"], ["Why must every loop have a test?", "Otherwise it never ends", "To print results", "To read data", "To name variables"], ["In the loop that adds 2 + 4 + … + 30, the starting value of sum is…", "0", "2", "30", "1"], ["What does this print?  sum ← 0, i ← 1;  while i <= 5: sum ← sum + i, i ← i + 1;  print sum", "15", "10", "5", "20"], ["Which language generation uses only 0s and 1s?", "First (machine language)", "Second (assembly)", "Third (high-level)", "Fourth"], ["A program that translates assembly language into machine code is a…", "assembler", "web browser", "text editor", "spreadsheet"], ["Which of these is a high-level language?", "C++", "Machine language", "Assembly language", "Binary code"], ["SQL is an example of a…", "fourth-generation language", "first-generation language", "second-generation language", "machine language"], ["The paradigm “program = objects + messages” is…", "object-oriented", "imperative", "logical", "functional"], ["Prolog follows which paradigm?", "Logic (declarative)", "Object-oriented", "Imperative", "Unstructured"], ["Encapsulation means…", "bundling data with the functions that use it", "copying code between programs", "translating code to binary", "drawing a flowchart"]],qz=document.getElementById('quiz'),sc=document.getElementById('score'),kd=document.getElementById('key'),n,r,keys;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function upd(){sc.textContent='Score: '+r+' / '+Q.length+'  ·  answered '+n}
function build(){qz.innerHTML='';kd.hidden=true;n=0;r=0;keys=[];upd();
Q.forEach(function(q,i){var o=sh(q.slice(1)),ci=o.indexOf(q[1]);keys.push((i+1)+'-'+'ABCD'[ci]);
var d=document.createElement('div');d.className='q';d.innerHTML='<b>'+(i+1)+'. '+q[0].replace(/</g,'&lt;')+'</b>';
var w=document.createElement('div');w.className='why';w.hidden=true;var done=false,bs=[];
o.forEach(function(t,j){var b=document.createElement('button');b.className='o';b.textContent='ABCD'[j]+'. '+t;bs.push(b);
b.onclick=function(){if(done)return;done=true;n++;if(j===ci){r++;b.classList.add('ok');w.textContent='Correct.'}else{b.classList.add('no');bs[ci].classList.add('ok');w.textContent='Not quite. The answer is '+'ABCD'[ci]+'.'}w.hidden=false;upd()};d.appendChild(b)});
d.appendChild(w);qz.appendChild(d)})}
document.getElementById('rst').onclick=build;
document.getElementById('keyb').onclick=function(){kd.textContent='Answer key: '+keys.join(',  ');kd.hidden=!kd.hidden};
build()})();
</script></body></html>
