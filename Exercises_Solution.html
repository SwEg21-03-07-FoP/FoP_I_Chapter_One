<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowchart Exercise Solutions</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>

    <style>
        body { background-color: #f6f8fa; margin: 0; padding: 20px; }
        .markdown-body {
            box-sizing: border-box; min-width: 200px; max-width: 900px;
            margin: 0 auto; padding: 45px; background-color: #fff;
            border: 1px solid #d0d7de; border-radius: 6px;
        }
        .error-message {
            color: #cf222e; background-color: #ffebe9; padding: 15px;
            border: 1px solid rgba(255,129,130,0.4); border-radius: 6px; font-weight: bold;
        }
        pre.mermaid { background: transparent; text-align: center; }
        @media (max-width: 767px) { .markdown-body { padding: 15px; } }
    </style>
</head>
<body>
    <article id="content" class="markdown-body"><p>Loading solutions...</p></article>

    <script>
        const markdownFilePath = 'Flowchart_Exercises_Solution.md';

        fetch(markdownFilePath)
            .then(r => {
                if (!r.ok) throw new Error('Failed to load file (Status: ' + r.status + ')');
                return r.text();
            })
            .then(async text => {
                if (typeof marked === 'undefined') throw new Error('Marked library failed to load.');
                const box = document.getElementById('content');
                box.innerHTML = marked.parse(text);

                // Turn ```mermaid code blocks into diagrams
                box.querySelectorAll('code.language-mermaid').forEach(code => {
                    const pre = document.createElement('pre');
                    pre.className = 'mermaid';
                    pre.textContent = code.textContent;
                    code.parentElement.replaceWith(pre);
                });
                if (typeof mermaid !== 'undefined') {
                    mermaid.initialize({ startOnLoad: false });
                    await mermaid.run({ querySelector: '.mermaid' });
                }
                if (typeof Prism !== 'undefined') Prism.highlightAll();
            })
            .catch(error => {
                document.getElementById('content').innerHTML =
                    '<div class="error-message"><h3>Unable to load Markdown File</h3><p>' +
                    error.message + '</p></div>';
                console.error(error);
            });
    </script>
</body>
</html>
