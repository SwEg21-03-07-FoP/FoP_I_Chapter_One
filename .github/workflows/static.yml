# Workflow for deploying static content to GitHub Pages
name: Deploy Multiple Apps to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Build the first app
      - name: Build App One
        run: |
          cd ../app-one
          npm install
          npm run build
          
      # 2. Build the second app
      - name: Build App Two
        run: |
          cd ../app-two
          npm install
          npm run build

      # 3. Combine build outputs into a single staging directory
      - name: Prepare Staging Directory
        run: |
          mkdir staging
          cp -r app-one/dist staging/app-one
          cp -r app-two/dist staging/app-two

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./staging

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
